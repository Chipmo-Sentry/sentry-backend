[project]
name = "sentry-backend"
version = "0.1.0"
description = "Chipmo Sentry HTTP API — auth, multi-tenant, alert CRUD, feedback"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Tuguldur Enkhtuvshin", email = "tuguldur.enkhtuvshin@yahoo.com" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.40",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<1.16",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.2,<26.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt==4.0.1",
    "cryptography>=42.0,<46.0",
    "httpx>=0.27,<0.30",
    "slowapi>=0.1.9,<0.2",
    "python-multipart>=0.0.9,<0.1",
    "uuid6>=2024.1,<2027.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=5.0,<7.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-python-jose>=3.3,<4.0",
    "types-passlib>=1.7,<2.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_backend"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle, pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # bugbear
    "A",                  # builtins shadow
    "C4",                 # comprehensions
    "PIE",                # misc
    "T20",                # print
    "RET",                # return
    "SIM",                # simplify
    "ARG",                # unused args
    "PTH",                # pathlib
    "ASYNC",              # async lints
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sentry_backend"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "slowapi.*", "factory.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=src/sentry_backend --cov-report=term-missing"
markers = [
    "integration: requires real Postgres (set DATABASE_URL)",
]
