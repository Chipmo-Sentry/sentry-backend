# Railway deployment config
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# ADR-0025: live_broker.py + alert_broker.py are IN-MEMORY per-process pub/sub.
# sentry-ai publishes live metadata to one replica; the browser WS subscribes on
# another → frames never cross the process boundary → no overlay / no behaviour.
# MUST stay at 1 replica until the brokers move to Redis pub/sub (TODO M2 BE10).
# ⚠️ Do NOT raise numReplicas before Redis lands, or live overlay breaks again.
numReplicas = 1

# Required env vars (set in Railway dashboard, NEVER committed):
#   DATABASE_URL              — provided by Railway Postgres addon
#   JWT_SECRET                — secrets.token_urlsafe(48)
#   SERVICE_TOKEN_SECRET      — secrets.token_urlsafe(48)
#   RTSP_FERNET_KEY           — Fernet.generate_key().decode()
#   ALLOWED_ORIGINS           — comma-separated, e.g. https://app.sentry.chipmo.mn
#   ENVIRONMENT=production
#   LOG_LEVEL=INFO
#   CLIP_STORAGE_DIR          — MUST point inside a Railway Volume (see below)
#
# ⚠️ T09 EVIDENCE CLIPS — Railway Volume (one-time dashboard setup):
# The container disk is EPHEMERAL: every deploy/restart wipes it, taking all
# evidence clips with it. Volumes cannot be declared in this file — create one
# in the dashboard:
#   1. Service → right-click / Cmd+K → "Attach Volume", mount path: /data
#   2. Set env var CLIP_STORAGE_DIR=/data/clips
#   3. Redeploy, then check boot logs for `clip_storage_ready` (a
#      `clip_storage_not_writable` error means the mount isn't writable by the
#      non-root `app` user — Railway's RAILWAY_RUN_UID may need adjusting).
